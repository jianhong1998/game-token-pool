services:
  # Image is `surfpool/surfpool`, NOT `txtx/surfpool` (the latter does not
  # exist on Docker Hub -- verified via `docker pull`). The entrypoint
  # already execs the `surfpool` binary, so `command:` must be the
  # subcommand/args only ("surfpool start ..." fails with "unrecognized
  # subcommand 'surfpool'" -- verified). `--host 0.0.0.0` is required: the
  # binary's default bind host is 127.0.0.1, which the `client` container
  # cannot reach over the compose network.
  surfpool:
    image: surfpool/surfpool:latest
    command: start --no-tui --port 8899 --host 0.0.0.0
    ports:
      - '8899:8899'
      - '8900:8900'
      - '18488:18488'
  client:
    ports:
      - '3000:3000'
    build:
      dockerfile: Dockerfile.client
    depends_on:
      - surfpool
    environment:
      - SOLANA_CLUSTER_PROVIDER=http://surfpool:8899
    develop:
      watch:
        - path: ./src
          target: /apps/crud-dapp/src
          action: sync
        - path: ./package.json
          action: rebuild
    # volumes:
    #   - ./.next:/apps/crud-dapp/.next
